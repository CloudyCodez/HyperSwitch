name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Generate Icon
        shell: pwsh
        run: python generate_icon.py

      - name: Validate Version Metadata
        shell: pwsh
        run: |
          $appVersion = python -c "from hyperswitch.metadata import APP_VERSION; print(APP_VERSION)"
          $appVersion = $appVersion.Trim()
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
            if ($appVersion -ne $tagVersion) {
              throw "Tag version $tagVersion does not match hyperswitch.metadata APP_VERSION $appVersion"
            }
          }

      - name: Build Release Executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "hyperswitch.ico;." --add-data "hyperswitch.png;." --add-data "chibi-cloud-watermark.png;." --icon hyperswitch.ico --name HyperSwitch hyperv_switch.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "hyperswitch.ico;." --add-data "hyperswitch.png;." --add-data "chibi-cloud-watermark.png;." --icon hyperswitch.ico --name HyperSwitchDBG hyperv_switch.py
          python scripts/package_release.py --version ${{ github.ref_name }}

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperSwitch-windows
          path: |
            dist/HyperSwitch.exe
            dist/HyperSwitchDBG.exe
            out/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --generate-notes --latest
          }
          gh release upload ${{ github.ref_name }} dist/HyperSwitch.exe --clobber
          gh release upload ${{ github.ref_name }} out/HyperSwitch-${{ github.ref_name }}-portable.zip --clobber
          gh release upload ${{ github.ref_name }} dist/HyperSwitchDBG.exe --clobber
